[project]
name = "snipeit-mcp"
version = "0.1.0"
description = "MCP server for Snipe-IT inventory management system"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0.0",
    "requests>=2.31.0",
    "snipeit-api>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/Wil-Collier/snipeit-mcp"

[tool.uv]
package = false

[tool.uv.sources]
snipeit-api = { git = "https://github.com/lfctech/snipeit-python-api", rev = "main" }
# TODO: push this to an artifact feed in gitea and use that instead of the git source above
# then you don't need git to build the container

[tool.ruff.lint]
ignore = ["BLE001", "RUF010"]
