services:
  whatsupdocker:
    image: getwud/wud:latest
    dns:
      - ${HPI_LOCAL_IP_ADDRESS}
    # ports:
    #   - "3000:3000"
    environment:
      TZ: ${HPI_TIME_ZONE}
      WUD_AUTH_ADMIN_USER: ${HPI_WHATSUPDOCKER_USERNAME}
      WUD_AUTH_ADMIN_PASSWORD: ${HPI_WHATSUPDOCKER_PASSWORD}

      WUD_REGISTRY_CUSTOM_HPIREGISTRY_URL: https://registry${HPI_HOSTNAME_SUFFIX}.${HPI_DNS_DOMAIN}:${HPI_HTTPS_PORT}

      WUD_WATCHER_HPICOMPOSE_SOCKET: /var/run/docker.sock
      WUD_WATCHER_HPICOMPOSE_CRON: "0 5 * * 4"
      WUD_WATCHER_HPICOMPOSE_WATCHATSTART: "false"
      WUD_WATCHER_HPICOMPOSE_WATCHDIGESTDEFAULT: "true"
      WUD_WATCHER_HPICOMPOSE_INCLUDE: label:^com\.docker\.compose

      WUD_WATCHER_SWARM_HPISWARM_SOCKET: /var/run/docker.sock
      WUD_WATCHER_SWARM_HPISWARM_CRON: "0 5 * * *"
      WUD_WATCHER_SWARM_HPISWARM_WATCHATSTART: "true"
      WUD_WATCHER_SWARM_HPISWARM_WATCHDIGESTDEFAULT: "true"

      # WUD can't trigger swarm updates, so this is monitor-only for those
      WUD_TRIGGER_DOCKER_HPIUPDATE_PRUNE: "true"
      WUD_TRIGGER_DOCKER_HPIUPDATE_SELFUPDATE: "false"  # runninng in swarm

      WUD_TRIGGER_NTFY_HPINTFY_URL: https://notify${HPI_HOSTNAME_SUFFIX}.${HPI_DNS_DOMAIN}:${HPI_HTTPS_PORT}
      WUD_TRIGGER_NTFY_HPINTFY_TOPIC: homepi
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HPI_LOCAL_DATA_PATH}/whatsupdocker:/store
    networks:
      - webproxy-backend
    labels:
      caddy: update${HPI_HOSTNAME_SUFFIX}.${HPI_DNS_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 3000}}"
      caddy.tls.propagation_delay: 120s
      caddy.tls.dns: desec
      caddy.tls.dns.token: ${HPI_DESEC_TOKEN}
    deploy:    
      labels:
        - homepage.group=Network & Administration
        - homepage.name=Updates  
        - homepage.icon=sh-wud
        - homepage.href=https://update${HPI_HOSTNAME_SUFFIX}.${HPI_DNS_DOMAIN}:${HPI_HTTPS_PORT}/
      placement:
        constraints:
          - node.role == manager

  shepherd:
    image: containrrr/shepherd
    dns:
      - ${HPI_LOCAL_IP_ADDRESS}
    environment:
      TZ: ${HPI_TIME_ZONE}
      # VAULT
      REGISTRY_USER: ${SHEPHERD_REGISTRY_USERNAME}
      REGISTRY_PASSWORD: ${SHEPHERD_REGISTRY_PASSWORD}
      VERBOSE: 'true'
      # Prevent Shepherd from updating its own task or the cron scheduler that launches it.
      IGNORELIST_SERVICES: 'update_shepherd hpi-mgmt_scheduler'
      FILTER_SERVICES: ''
      RUN_ONCE_AND_EXIT: 'true'
      IMAGE_AUTOCLEAN_LIMIT: 8
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      replicas: 0
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 2
      labels:
        - swarm.cronjob.enable=true
        # Start service every Friday at 5 AM
        - swarm.cronjob.schedule=0 5 * * 5
        - swarm.cronjob.skip-running=true
      placement:
        constraints:
          - node.role == manager

networks:
  webproxy-backend:
    external: true

