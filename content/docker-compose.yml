services:
  radarr: # Movies
    image: lscr.io/linuxserver/radarr:latest
    dns:
      - ${HPI_LOCAL_IP_ADDRESS}
    environment:
      - PUID=${HPI_APP_UID}
      - PGID=${HPI_APP_GID}
      - UMASK=002
      - TZ=${HPI_TIME_ZONE}
      - RADARR__APP__LAUNCHBROWSER=false
      - RADARR__AUTH__APIKEY=${HPI_RADARR_APIKEY}
      - RADARR__AUTH__ENABLED=true
      - RADARR__AUTH__METHOD=forms
      - RADARR__AUTH__REQUIRED=Enabled
      - RADARR__LOG__LEVEL=info
      - RADARR__LOG__ANALYTICSENABLED=false
      - RADARR__UPDATE__MECHANISM=Docker
    volumes:
      - ${HPI_LOCAL_DATA_PATH}/radarr:/config
      - ${HPI_LOCAL_DATA_PATH}/share:/data
    networks:
      - webproxy-backend
    labels:
      caddy: content-movies${HPI_HOSTNAME_SUFFIX}.${HPI_DNS_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 7878}}"
      caddy.tls.propagation_delay: 120s
      caddy.tls.dns: desec
      caddy.tls.dns.token: ${HPI_DESEC_TOKEN}
      loggifly.monitor: "true"
      loggifly.ntfy_topic: "hpi-low"
      loggifly.ntfy_priority: "2"
    # ports:
    #   - "7878:7878"
    deploy:
      labels:
        - homepage.group=Media & Entertainment
        - homepage.name=Movies
        - homepage.icon=sh-radarr
        - homepage.href=https://content-movies${HPI_HOSTNAME_SUFFIX}.${HPI_DNS_DOMAIN}:${HPI_HTTPS_PORT}/

  sonarr: # TV
