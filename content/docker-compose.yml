      - SONARR__AUTH__APIKEY=${HPI_SONARR_APIKEY}
      # - SONARR__AUTH__ENABLED=true  # sonarr doesn't like this, forces it from forms to basic
      - SONARR__AUTH__METHOD=forms
      - SONARR__AUTH__REQUIRED=Enabled
      - SONARR__LOG__LEVEL=info
      - SONARR__LOG__ANALYTICSENABLED=false
      - SONARR__UPDATE__MECHANISM=Docker
    volumes:
      - ${HPI_LOCAL_DATA_PATH}/sonarr:/config
