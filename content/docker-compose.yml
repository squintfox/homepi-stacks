      - PGID=${HPI_APP_GID}
      - TZ=${HPI_TIME_ZONE}
    volumes:
      - ${HPI_LOCAL_DATA_PATH}/bazarr:/config
      - ${HPI_LOCAL_DATA_PATH}/share:/data
    networks:
      - webproxy-backend
    labels:
      caddy: content-subtitles${HPI_HOSTNAME_SUFFIX}.${HPI_DNS_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 6767}}"
