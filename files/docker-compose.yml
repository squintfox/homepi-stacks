services:
  filebrowser:
    image: ghcr.io/gtsteffaniak/filebrowser:stable
    dns:
      - ${HPI_LOCAL_IP_ADDRESS}
    user: "${HPI_APP_UID}:${HPI_APP_GID}"
    environment:
      FILEBROWSER_ADMIN_PASSWORD: ${HPI_FILEBROWSER_ADMIN_PASSWORD}
      FILEBROWSER_FFMPEG_PATH: "/usr/local/bin"
    volumes:
      - ${HPI_LOCAL_DATA_PATH}/filebrowser:/home/filebrowser/data
      - ${HPI_LOCAL_DATA_PATH}:/local-data
    networks:
      - webproxy-backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    labels:
      caddy: files${HPI_HOSTNAME_SUFFIX}.${HPI_DNS_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 8080}}"
      caddy.tls.propagation_delay: 120s
      caddy.tls.dns: desec
      caddy.tls.dns.token: ${HPI_DESEC_TOKEN}
      loggifly.monitor: "true"
      loggifly.ignore_keywords: "Failed to index directory"
    deploy:
      labels:
        homepage.group: Tools
        homepage.name: Filebrowser
        homepage.icon: mdi-folder
        homepage.href: https://files${HPI_HOSTNAME_SUFFIX}.${HPI_DNS_DOMAIN}:${HPI_HTTPS_PORT}/

networks:
  webproxy-backend:
    external: true

