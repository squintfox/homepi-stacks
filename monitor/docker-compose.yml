services:
  beszel:
    image: henrygd/beszel
    dns:
      - ${HPI_LOCAL_IP_ADDRESS}
    volumes:
      - ${HPI_LOCAL_DATA_PATH}/beszel/data:/beszel_data
      - ${HPI_LOCAL_DATA_PATH}/beszel/socket:/beszel_socket
    # ports:
    #   - 8090:8090
    networks:
      - webproxy-backend
    labels:
      caddy: monitoring${HPI_HOSTNAME_SUFFIX}.${HPI_DNS_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 8090}}"
      caddy.tls.propagation_delay: 120s
      caddy.tls.dns: desec
      caddy.tls.dns.token: ${HPI_DESEC_TOKEN}
    deploy:
      labels:
        homepage.group: Monitoring  
        homepage.name: Monitor  
        homepage.icon: sh-beszel
        homepage.href: https://monitoring${HPI_HOSTNAME_SUFFIX}.${HPI_DNS_DOMAIN}:${HPI_HTTPS_PORT}/

  beszel-agent:
    image: henrygd/beszel-agent
    dns:
      - ${HPI_LOCAL_IP_ADDRESS}
    network_mode: host
    volumes:
      # trying to use the docker proxy didn't work completely, networking wasn't working
      # and some metrics didn't show
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # monitor other disks / partitions by mounting a folder in /extra-filesystems
      # - /mnt/disk1/.beszel:/extra-filesystems/disk1:ro
      - ${HPI_LOCAL_DATA_PATH}/beszel/socket:/beszel_socket
    environment:
      LISTEN: /beszel_socket/beszel.sock
      KEY: ${BESZEL_AGENT_PASSWORD}

  speedtest-tracker:
    image: linuxserver/speedtest-tracker:latest
    dns:
      - ${HPI_LOCAL_IP_ADDRESS}
    # ports:
    #   - 8080:80
    #   - 8443:443
    environment:
      - PUID=${HPI_APP_UID}
      - PGID=${HPI_APP_GID}
      - APP_TIMEZONE=${HPI_TIME_ZONE}
      - DISPLAY_TIMEZONE=${HPI_TIME_ZONE}
      # VAULT
      - DB_USERNAME=${SPEEDTEST_DB_USERNAME}
      - DB_PASSWORD=${SPEEDTEST_DB_PASSWORD}
      - APP_KEY=base64:${SPEEDTEST_APP_KEY}
      - DB_CONNECTION=pgsql
      - DB_HOST=speedtest-db
      - DB_PORT=5432
      - DB_DATABASE=${SPEEDTEST_DB_DATABASE}
      - APP_URL=https://speedtest${HPI_HOSTNAME_SUFFIX}.${HPI_DNS_DOMAIN}:${HPI_HTTPS_PORT}
      - ASSET_URL=https://speedtest${HPI_HOSTNAME_SUFFIX}.${HPI_DNS_DOMAIN}:${HPI_HTTPS_PORT}
      - MAIL_MAILER=smtp
      - MAIL_HOST=notify${HPI_HOSTNAME_SUFFIX}.${HPI_DNS_DOMAIN}
      - MAIL_PORT=8025
      - MAIL_USERNAME=null
      - MAIL_PASSWORD=null
      - MAIL_FROM_ADDRESS="speedtest@${HPI_DNS_DOMAIN}"
      - MAIL_FROM_NAME="Speedtest Tracker"
      - MAIL_SCHEME=null
      - SPEEDTEST_SCHEDULE=6 */1 * * *
      - SPEEDTEST_SERVERS=57682, 14236, 43201 # this one sucked, but maybe that was real?  56370
      - SPEEDTEST_PRUNE_RESULTS_OLDER_THAN=0
      - PUBLIC_DASHBOARD='true'
      - LOG_LEVEL=INFO
    volumes:
      - ${HPI_LOCAL_DATA_PATH}/speedtest/config:/config
    # - /path/to-custom-ssl-keys:/config/keys
    networks:
      - webproxy-backend
    labels:
      caddy: speedtest${HPI_HOSTNAME_SUFFIX}.${HPI_DNS_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 80}}"
      caddy.tls.propagation_delay: 120s
      caddy.tls.dns: desec
      caddy.tls.dns.token: ${HPI_DESEC_TOKEN}
    deploy:
      labels:
        homepage.group: Monitoring  
        homepage.name: Speedtest  
        homepage.icon: sh-speedtest-tracker
        homepage.href: https://speedtest${HPI_HOSTNAME_SUFFIX}.${HPI_DNS_DOMAIN}:${HPI_HTTPS_PORT}/

  speedtest-db:
    image: postgres:18
    dns:
      - ${HPI_LOCAL_IP_ADDRESS}
    environment:
      POSTGRES_DB: ${SPEEDTEST_DB_DATABASE}
      # VAULT
      POSTGRES_USER: ${SPEEDTEST_DB_USERNAME}
      POSTGRES_PASSWORD: ${SPEEDTEST_DB_PASSWORD}
    volumes:
      - ${HPI_LOCAL_DATA_PATH}/speedtest/postgres_db:/var/lib/postgresql
    networks:
      - webproxy-backend

  loggifly:
    image: ghcr.io/clemcer/loggifly:v2
    dns:
      - ${HPI_LOCAL_IP_ADDRESS}
    user: ${HPI_APP_UID}:${HPI_APP_GID}
    read_only: true
    volumes:
      - ${HPI_LOCAL_DATA_PATH}/loggifly/config:/config
    networks:
      - webproxy-backend
    environment:
      TZ: ${HPI_TIME_ZONE}
      DOCKER_HOST: tcp://dockerproxy:2375
      LOG_LEVEL: INFO
      NTFY_URL: https://notify${HPI_HOSTNAME_SUFFIX}.${HPI_DNS_DOMAIN}:${HPI_HTTPS_PORT}
      NTFY_TOPIC: "hpi"
      NTFY_PRIORITY: "3"  # default
      # NTFY_TOKEN: ${HPI_LOGGIFLY_NTFY_TOKEN}
      # APPRISE_URL: "discord://..."        # Apprise-compatible URL
      # CONTAINERS: "vaultwarden,audiobookshelf"   # comma-separated container names to monitor
      CONTAINERS_CONTAINER_EVENTS: "die,crash,unhealthy,oom,kill"
      SWARM_CONTAINER_EVENTS: "die,crash,unhealthy,oom,kill"
      # keywords applied to all monitored containers
      GLOBAL_KEYWORDS: "error,failed,exception,fatal,connection refused,out of memory,permission denied,authentication failed"
      MERGE_MATCHES: "true"

networks:
  webproxy-backend:
    external: true

