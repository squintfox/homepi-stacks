  semaphore-pgupgrade:
    image: pgautoupgrade/pgautoupgrade:latest
    environment:
      PGAUTO_ONESHOT: 'yes'
      POSTGRES_PASSWORD: ${SEMAPHORE_DB_PASSWORD}
    volumes:
      - ${HPI_LOCAL_DATA_PATH}/semaphore/postgres_db:/var/lib/postgresql/data
    networks:
      - webproxy-backend
    deploy:
      replicas: 0
      restart_policy:
        condition: none

networks:
  webproxy-backend:
    external: true
