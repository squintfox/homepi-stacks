services:
  actual:
    image: actualbudget/actual-server:latest
    # ports:
    #   - '5006:5006'
    environment:
      - ACTUAL_TOKEN_EXPIRATION=3600
      - ACTUAL_LOGIN_METHOD=openid
      - ACTUAL_ALLOWED_LOGIN_METHODS=password,openid
      - ACTUAL_OPENID_DISCOVERY_URL=https://auth.${HPI_DNS_DOMAIN}:${HPI_HTTPS_PORT}/realms/master/.well-known/openid-configuration
      - ACTUAL_OPENID_CLIENT_ID=${ACTUAL_OPENID_CLIENT_USERNAME}
      - ACTUAL_OPENID_CLIENT_SECRET=${ACTUAL_OPENID_CLIENT_SECRET}
      - ACTUAL_OPENID_SERVER_HOSTNAME=https://budget.${HPI_DNS_DOMAIN}:${HPI_HTTPS_PORT}
      - ACTUAL_OPENID_AUTH_METHOD=openid
      - ACTUAL_OPENID_ENFORCE=false
      - ACTUAL_USER_CREATION_MODE=manual
      # - ACTUAL_HTTPS_KEY=/data/selfhost.key
      # - ACTUAL_HTTPS_CERT=/data/selfhost.crt
      # - ACTUAL_PORT=5006
      # - ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB=20
      # - ACTUAL_UPLOAD_SYNC_ENCRYPTED_FILE_SYNC_SIZE_LIMIT_MB=50
      # - ACTUAL_UPLOAD_FILE_SIZE_LIMIT_MB=20
      # # See all options and more details at https://actualbudget.org/docs/config/
    volumes:
      - ${HPI_LOCAL_DATA_PATH}/actual-budget:/data
    healthcheck:
      # Enable health check for the instance
      test: ["CMD-SHELL", "node src/scripts/health-check.js"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - webproxy-backend
    labels:
      caddy: budget.${HPI_DNS_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 5006}}"
      caddy.tls.propagation_delay: 120s
      caddy.tls.dns: desec
      caddy.tls.dns.token: ${HPI_DESEC_TOKEN}
    deploy:
      labels:
        homepage.group: Finance
        homepage.name: Budget
        homepage.icon: sh-actual-budget
        homepage.href: https://budget.${HPI_DNS_DOMAIN}:${HPI_HTTPS_PORT}/
        # - homepage.description=

  api:
    image: jhonderson/actual-http-api:latest
    environment:
      - PORT=5007
      # - ACTUAL_DATA_DIR=./data
      - ACTUAL_SERVER_URL=https://budget.${HPI_DNS_DOMAIN}:${HPI_HTTPS_PORT}/
      - ACTUAL_SERVER_PASSWORD=${ACTUAL_BUDGET_PASSWORD}
      - API_KEY=${ACTUAL_API_PASSWORD}
    networks:
      - webproxy-backend
    labels:
      caddy: budget-api.${HPI_DNS_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 5007}}"
      caddy.tls.propagation_delay: 120s
      caddy.tls.dns: desec
      caddy.tls.dns.token: ${HPI_DESEC_TOKEN}
    deploy:
      labels:
        - homepage.group=Finance
        - homepage.name=Budget API
        - homepage.icon=sh-swagger
        - homepage.href=https://budget-api.${HPI_DNS_DOMAIN}:${HPI_HTTPS_PORT}/api-docs/

  helper: &helper-base
    image: ghcr.io/psybers/actual-helpers:latest
    environment:
      - ACTUAL_SERVER_URL=https://budget.${HPI_DNS_DOMAIN}:${HPI_HTTPS_PORT}/
      - ACTUAL_SERVER_PASSWORD=${ACTUAL_BUDGET_PASSWORD}
      - ACTUAL_SYNC_ID=${ACTUAL_BUDGET_SYNC_ID}
      # # do not allow self-signed SSL certs
      - NODE_TLS_REJECT_UNAUTHORIZED=1
      # # optional, for encrypted files
      # - ACTUAL_FILE_PASSWORD="<file password>"
      # optional, if you want to use a different cache directory
      # - ACTUAL_CACHE_DIR="./cache"
      # # optional, name of the payee for added interest transactions
      # - INTEREST_PAYEE_NAME="Loan Interest"
      # # optional, name of the payee for added investment transactions
      # - INVESTMENT_PAYEE_NAME="Investment"
      # # optional, name of the category group for added investment tracking transactions
      # - INVESTMENT_CATEGORY_GROUP_NAME="Income"
      # # optional, name of the category for added investment tracking transactions
      # - INVESTMENT_CATEGORY_NAME="Investment"
      # optional, name of the payee for Zestimate entries
      - ZESTIMATE_PAYEE_NAME=Zillow
      # optional, name of the payee for KBB entries
      - KBB_PAYEE_NAME=Kelley Blue Book
      # # optional, the URL for tracking Bitcoin prices
      # - BITCOIN_PRICE_URL="https://api.kraken.com/0/public/Ticker?pair=xbtusd"
      # # optional, the JSON path in the response to get the Bitcoin price
      # - BITCOIN_PRICE_JSON_PATH="result.XXBTZUSD.c[0]"
      # # optional, name of the payee for Bitcoin entries
      # - BITCOIN_PAYEE_NAME="Bitcoin Price Change"
      # # optional, RentCast API key for fetching property data
      # - RENTCAST_API_KEY="<Rentcast API key>"
      # - RENTCAST_PAYEE_NAME="RentCast"
    networks:
      - webproxy-backend
    volumes:
      - ${HPI_LOCAL_DATA_PATH}/actual-budget/helpers-cache:/usr/src/app/cache
    deploy:
      replicas: 0
      restart_policy:
        condition: none

  helper-kbb:
    <<: *helper-base
    entrypoint: ["node"]
    command: ["kbb.js"]
    deploy:
      replicas: 0
      restart_policy:
        condition: none
      labels:
        - swarm.cronjob.enable=true
        # Start service every Tuesday at 3 AM
        - swarm.cronjob.schedule=0 3 * * 2
        - swarm.cronjob.skip-running=true

  # helper-zestimate:
  #   <<: *helper-base
  #   entrypoint: ["sh", "-c"]
  #   # TODO: this is erroring out
  #   command:
  #     - |
  #       node -e "const fs=require('fs'); const p='zestimate.js'; let s=fs.readFileSync(p,'utf8'); if(!s.includes('--no-sandbox')) { s=s.replace('.forBrowser(Browser.CHROME)\n        .build();', '.forBrowser(Browser.CHROME)\n        .setChromeOptions((new (require(\'selenium-webdriver/chrome\').Options)()).addArguments(\'--headless=new\',\'--no-sandbox\',\'--disable-dev-shm-usage\',\'--disable-gpu\',\'--remote-debugging-port=9222\'))\n        .build();'); fs.writeFileSync(p,s); }"
  #       node zestimate.js
  #   deploy:
  #     replicas: 0
  #     restart_policy:
  #       condition: none
  #     labels:
  #       - swarm.cronjob.enable=true
  #       # Start service every Wednesday at 3 AM
  #       - swarm.cronjob.schedule=0 3 * * 3
  #       - swarm.cronjob.skip-running=true

  helper-bank-sync:
    <<: *helper-base
    entrypoint: ["node"]
    command: ["sync-banks.js"]
    deploy:
      replicas: 0
      restart_policy:
        condition: none
      labels:
        - swarm.cronjob.enable=true
        # Start service at 6AM, 3PM and 5PM daily
        - swarm.cronjob.schedule=0 6,15,17 * * *
        - swarm.cronjob.skip-running=true

networks:
  webproxy-backend:
    external: true
