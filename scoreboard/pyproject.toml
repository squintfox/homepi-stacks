[project]
name = "homepi-scoreboard"
version = "0.2.15"
description = "Simple digital scoreboard web app"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.116.0",
  "jinja2>=3.1.6",
  "uvicorn[standard]>=0.35.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scoreboard_app"]
